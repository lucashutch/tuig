[workspace]
resolver = "3"
members = ["crates/tuig-app", "crates/tuig-cli", "crates/tuig-git", "crates/tuig-ui-model", "crates/tuig-widgets"]

[workspace.package]
edition = "2024"
version = "0.2.0"
license = "MIT"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# One pin for every crate, from crates.io. The exact version also names the git tag that scripts/build-opentui-native.sh
# builds the native library from, because the crates do not ship that library. To bump it, see README.md.
opentui = { version = "=0.9.7", features = ["tokio", "tree-sitter"] }

# Release binary: LTO and one codegen unit shrink and speed up the code, strip drops symbols and debug info.
# panic stays "unwind": the terminal restore runs from Drop, and tokio tasks isolate panics.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
