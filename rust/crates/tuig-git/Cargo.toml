[package]
name = "tuig-git"
description = "Git process boundary, parsers, and domain types for tuig"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
# Error types with Display messages that match the TypeScript messages.
thiserror = "2"
# Host extraction and auth classification of git/ssh stderr (case-insensitive patterns).
regex = "1"
# Reflog token for undo previews. The token is the SHA-256 of the HEAD reflog.
sha2 = "0.10"

# JSON parsing of `gh api graphql` output.
serde_json = "1"
# Filesystem events (inotify, FSEvents, ReadDirectoryChangesW) for the repository watcher.
notify = "8"
# Async runtime: child processes, timers, channels, and pipe I/O. `macros` provides `join!` and
# `select!` for the library and `#[tokio::test]` for tests. No `fs`, `net`, or multi-thread runtime.
tokio = { version = "1.54.1", default-features = false, features = ["process", "rt", "macros", "time", "sync", "io-util"] }
# `CancellationToken`, the cancel signal behind `CancelToken`.
tokio-util = { version = "0.7.20", default-features = false }
# Makes `GitRepository` and `PullRequestService` usable as `Arc<dyn ...>` with `Send` futures.
async-trait = "0.1.92"

[target.'cfg(unix)'.dependencies]
# Signal a whole process group (kill(-pid)) so cancelled helpers do not hold pipes open.
libc = "0.2"

[lints]
workspace = true
