[package]
name = "tuig-git"
description = "Git process boundary, parsers, and domain types for tuig"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
# Error types with Display messages that match the TypeScript messages.
thiserror = "2"
# Host extraction and auth classification of git/ssh stderr (case-insensitive patterns).
regex = "1"
# Reflog token for undo previews. The token is the SHA-256 of the HEAD reflog.
sha2 = "0.10"

# JSON parsing of `gh api graphql` output.
serde_json = "1"
# Filesystem events (inotify, FSEvents, ReadDirectoryChangesW) for the repository watcher.
notify = "8"

[target.'cfg(unix)'.dependencies]
# Signal a whole process group (kill(-pid)) so cancelled helpers do not hold pipes open.
libc = "0.2"

[lints]
workspace = true
