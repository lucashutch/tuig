[package]
name = "tuig-widgets"
description = "OpenTUI widgets for tuig that paint tuig-ui-model state"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
tuig-git = { path = "../tuig-git" }
tuig-ui-model = { path = "../tuig-ui-model" }
opentui.workspace = true
jiff = "0.2"
# Grammars the TypeScript app loads from `tree-sitter-wasm` that OpenTUI does not bundle. See `grammars.rs`.
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
# The same versions OpenTUI bundles, for Core's TypeScript and Markdown queries.
tree-sitter-typescript = "0.23.2"
tree-sitter-md = "0.5.4"

[lints]
workspace = true
