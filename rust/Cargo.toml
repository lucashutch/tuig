[workspace]
resolver = "3"
members = ["crates/tuig-app", "crates/tuig-cli", "crates/tuig-git", "crates/tuig-spike", "crates/tuig-ui-model", "crates/tuig-widgets"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# One pin for every crate. scripts/build-opentui-native.sh reads this rev to build the matching native library.
# To bump it, see README.md.
opentui = { git = "https://github.com/anomalyco/opentui", rev = "d5c7fca0c916e0be34578fcb6ea85f172356b045", features = ["tokio", "tree-sitter"] }
