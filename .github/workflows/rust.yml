name: Rust

on:
  push:
    branches: [main]
    paths: ["rust/**", "package.json", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**", "package.json", ".github/workflows/rust.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          # Keep equal to .zig-version of the OpenTUI rev pinned in rust/Cargo.toml. The build script stops on a mismatch.
          version: 0.17.0
      - name: Read the pinned OpenTUI rev
        id: opentui
        run: echo "rev=$(sed -n 's|^opentui = {.*rev = "\([0-9a-f]\{40\}\)".*|\1|p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache the OpenTUI native library
        uses: actions/cache@v5
        with:
          path: rust/.opentui-native
          key: opentui-native-${{ runner.os }}-${{ steps.opentui.outputs.rev }}
      - run: sh scripts/build-opentui-native.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Build the release package
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: tuig-x86_64-linux
          path: |
            rust/dist/*.tar.gz
            rust/dist/*.sha256
