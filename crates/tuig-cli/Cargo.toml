[package]
name = "tuig-cli"
description = "Command line handling, update check, URL opener and start-up repositories for tuig"
edition.workspace = true
version.workspace = true
publish = false
license.workspace = true

[dependencies]
tuig-git = { path = "../tuig-git" }
tuig-ui-model = { path = "../tuig-ui-model" }
async-trait = "0.1.92"
serde_json = "1"
# The SHA-256 sum of a downloaded release package.
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.54.1", default-features = false, features = ["process", "rt", "macros", "time", "io-util"] }


[lints]
workspace = true
